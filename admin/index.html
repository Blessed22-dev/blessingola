<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Admin · Blessed KDP-Designzz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234a50f0'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23fff'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="ring"></i><i class="ball"></i><i class="dots"></i></div>

<!-- ============ LOGIN ============ -->
<section class="login" id="loginView" hidden>
  <div class="login-intro">
    <h1>Website<br>Admin</h1>
    <p>Edit every part of your landing page, upload new work and publish in one click.</p>
  </div>
  <form class="login-card" id="loginForm" autocomplete="on">
    <span class="logo-tile" aria-hidden="true">★</span>
    <h2>Welcome back</h2>
    <p class="muted">Log in to manage your website.</p>
    <label for="lUser">Username</label>
    <input id="lUser" name="username" autocomplete="username" required>
    <label for="lPass">Password</label>
    <div class="pass-wrap">
      <input id="lPass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="pass-eye" id="lEye" aria-label="Show password">Show</button>
    </div>
    <p class="error" id="lError" hidden></p>
    <button class="btn btn-primary btn-wide" type="submit" id="lBtn">Log in</button>
    <a class="back-link" href="../">← Back to the website</a>
  </form>
</section>

<!-- ============ APP ============ -->
<div class="shell" id="appView" hidden>
  <nav class="rail" id="rail" aria-label="Admin menu"></nav>

  <div class="main">
    <header class="topbar">
      <div class="search">
        <span class="ic" data-icon="search" aria-hidden="true"></span>
        <input id="searchBox" type="search" placeholder="Search sections, books, reviews…" aria-label="Search the admin" autocomplete="off">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="top-right">
        <span class="save-state" id="status" role="status" aria-live="polite">Loading…</span>
        <button class="btn btn-soft" id="discardBtn" type="button" disabled>Undo</button>
        <button class="btn btn-primary" id="saveBtn" type="button" disabled>Save &amp; publish</button>
        <a class="round-btn" href="../" target="_blank" rel="noopener" title="View live site" aria-label="View live site"><span data-icon="external"></span></a>
        <div class="bell-wrap">
          <button class="round-btn" id="bellBtn" type="button" title="Unsaved changes" aria-label="Unsaved changes" aria-expanded="false"><span data-icon="bell"></span><i class="dot" id="bellDot" hidden></i></button>
          <div class="pop" id="bellPop" hidden></div>
        </div>
        <img class="avatar" id="avatar" alt="" width="44" height="44">
      </div>
    </header>

    <div class="draft-banner" id="draftBanner" hidden>
      <span>You have unsaved changes from your last visit.</span>
      <button class="btn btn-primary btn-sm" id="draftRestore" type="button">Restore them</button>
      <button class="btn btn-soft btn-sm" id="draftDrop" type="button">Discard</button>
    </div>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- edit drawer for table rows -->
<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drawerTitle" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <h2 id="drawerTitle">Edit</h2>
    <button class="round-btn" id="drawerClose" type="button" aria-label="Close"><span data-icon="close"></span></button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer class="drawer-foot">
    <button class="btn btn-danger" id="drawerDelete" type="button">Delete</button>
    <button class="btn btn-primary" id="drawerDone" type="button">Done</button>
  </footer>
</aside>

<!-- preview modal -->
<div class="modal-bg" id="previewModal" hidden>
  <div class="modal">
    <header class="modal-head">
      <h2>Live preview</h2>
      <div class="seg" role="group" aria-label="Preview size">
        <button type="button" data-device="desktop" aria-pressed="true">Computer</button>
        <button type="button" data-device="phone" aria-pressed="false">Phone</button>
      </div>
      <button class="round-btn" id="previewClose" type="button" aria-label="Close preview"><span data-icon="close"></span></button>
    </header>
    <div class="preview-stage" id="previewStage"><iframe id="previewFrame" title="Preview of your website"></iframe></div>
  </div>
</div>

<div class="toast" id="toast" role="alert" hidden></div>
<script type="module" src="admin.js"></script>
</body>
</html>
