<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#333}iframe{border:0;display:block}</style></head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.width = q.get('w') || 1440; f.height = q.get('h') || 900;
  f.addEventListener('load', () => {
    const w = f.contentWindow, d = f.contentDocument;
    d.documentElement.style.scrollBehavior = 'auto';
    const sel = q.get('to');
    const off = +(q.get('off') || 0);
    if (sel) { const el = d.querySelector(sel); w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY + off); }
    if (q.get('click')) setTimeout(() => d.querySelector(q.get('click')).click(), 400);
  });
</script>
</body></html>
